name: CI

# PR 與 develop/main 的 push 都跑共用品質關卡；部署 workflow 仍可在 push 時執行自己的部署前檢查。
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency security review
    runs-on: ubuntu-latest
    # dependency-review-action 以 PR 的 base／head 兩個 ref 比對相依套件差異，push 事件沒有這組
    # ref，跑起來一定以「Both a base ref and head ref must be provided」失敗，因此限定 PR 才執行。
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  migration-schema:
    name: Migration schema static check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate migration filenames and pairs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(migrations/*.sql)
          if ((${#files[@]} == 0)); then
            echo "No migration files found" >&2
            exit 1
          fi

          declare -A up_names=()
          declare -A down_names=()
          declare -A version_names=()

          for path in "${files[@]}"; do
            file="${path##*/}"
            if [[ ! "$file" =~ ^([0-9]{6})_([a-z0-9_]+)\.(up|down)\.sql$ ]]; then
              echo "Invalid migration filename: $file" >&2
              exit 1
            fi

            version="${BASH_REMATCH[1]}"
            name="${BASH_REMATCH[2]}"
            direction="${BASH_REMATCH[3]}"
            key="${version}_${name}"

            if [[ ! -s "$path" ]]; then
              echo "Empty migration file: $file" >&2
              exit 1
            fi

            if [[ -n "${version_names[$version]+set}" && "${version_names[$version]}" != "$key" ]]; then
              echo "Duplicate migration version: $version" >&2
              exit 1
            fi
            version_names["$version"]="$key"

            if [[ "$direction" == "up" ]]; then
              if [[ -n "${up_names[$key]+set}" ]]; then
                echo "Duplicate up migration: $file" >&2
                exit 1
              fi
              up_names["$key"]=1
            else
              if [[ -n "${down_names[$key]+set}" ]]; then
                echo "Duplicate down migration: $file" >&2
                exit 1
              fi
              down_names["$key"]=1
            fi
          done

          for key in "${!up_names[@]}"; do
            if [[ -z "${down_names[$key]+set}" ]]; then
              echo "Missing down migration for: ${key}.up.sql" >&2
              exit 1
            fi
          done

          for key in "${!down_names[@]}"; do
            if [[ -z "${up_names[$key]+set}" ]]; then
              echo "Missing up migration for: ${key}.down.sql" >&2
              exit 1
            fi
          done

          echo "Validated ${#version_names[@]} migration versions with matching up/down files."

  migration-integration:
    name: PostgreSQL migration and integration test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ltc_system
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ltc_system"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/ltc_system?sslmode=disable
      ENCRYPTION_KEY: MDEwMjAzMDQwNTA2MDcwODAxMDIwMzA0MDUwNjA3MDg=
      HMAC_KEY: MDkwODAwMDcwNjA1MDQwMzA5MDgwMDA3MDYwNTA0MDM=
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Apply all migrations
        run: go run ./cmd/migrate up

      - name: Verify irreversible security migration stays applied
        shell: bash
        run: |
          set -euo pipefail

          expected_latest_version=$(PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ltc_system -Atqc "SELECT COALESCE(MAX(version), -1) FROM schema_migrations;")
          if (( expected_latest_version < 54 )); then
            echo "migration 000054 was not applied; latest tracked version is ${expected_latest_version}" >&2
            exit 1
          fi

          # The runner rolls back only the latest tracked migration. Walk newer
          # migrations back first so this assertion actually exercises 000054.
          current_latest_version=$expected_latest_version
          while (( current_latest_version > 54 )); do
            go run ./cmd/migrate down
            current_latest_version=$(PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ltc_system -Atqc "SELECT MAX(version) FROM schema_migrations;")
          done

          if down_output=$(go run ./cmd/migrate down 2>&1); then
            echo "expected the irreversible security migration rollback to be refused"
            exit 1
          else
            echo "$down_output"
          fi
          grep -F "migration 000054 is irreversible security hardening; rollback is refused" <<< "$down_output"
          tracked_version=$(PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ltc_system -Atc "SELECT count(*) FROM schema_migrations WHERE version = 54;")
          test "$tracked_version" = "1"
          go run ./cmd/migrate up
          reapplied_latest_version=$(PGPASSWORD=postgrespassword psql -h localhost -U postgres -d ltc_system -Atqc "SELECT MAX(version) FROM schema_migrations;")
          test "$reapplied_latest_version" = "$expected_latest_version"

      - name: Verify public table lockdown integration
        run: go test -tags=integration ./cmd/migrate -run TestPublicTableLockdown -v

      - name: Run PostgreSQL integration tests
        run: go test -tags=integration ./internal/modules/caseimport/app ./internal/modules/driverreport/infra -run 'TestCommitCases_TransactionRollback|TestDriverReportRepository_LockSerializesSameFormMonth' -v

  api:
    name: API test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Go vulnerability check
        # 不用 golang/govulncheck-action：它內部固定 go install .../govulncheck@latest，
        # 最新版 golang.org/x/vuln 已要求 go >= 1.26，跟 go.mod 釘住的 1.25.14 不相容而直接失敗。
        # 改成自行安裝 v1.7.0（相容 go >= 1.25.0）並直接執行，同時避開該 action 內部再跑一次
        # setup-go 還原同一份 module cache 而撞出 tar "File exists" 的問題。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build server and migration binaries
        run: |
          go build ./cmd/server
          go build ./cmd/migrate

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      LIVE_SUPABASE_URL: ${{ secrets.LIVE_SUPABASE_URL }}
      LIVE_SUPABASE_ANON_KEY: ${{ secrets.LIVE_SUPABASE_ANON_KEY }}
      LIVE_API_BASE_URL: ${{ secrets.LIVE_API_BASE_URL }}
      LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
      LIVE_TEST_PASSWORD: ${{ secrets.LIVE_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm run test

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Live API-level E2E (when secrets are configured)
        run: npm run test:e2e:live

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 不用 gitleaks-action：它對 organization repo 需要授權金鑰，gitleaks 本體沒有此限制。
      # 以 dir 模式只掃 checkout 出來的工作樹，不掃 git 歷史：歷史裡的舊金鑰無法靠掃描修復，
      # 只能靠輪換，掃描的職責是擋下新的外洩。放行清單見 .gitleaks.toml。
      - name: Scan working tree for secrets
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            dir /repo --redact --no-banner --config=/repo/.gitleaks.toml --exit-code 1
