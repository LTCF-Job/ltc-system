name: Deploy Web to Vercel

# push 觸發，理由同 deploy-api.yml：workflow_run 一律讀 default branch 上的
# 工作流程定義檔，不是觸發它的那個分支，會讓 develop 分支的修正永遠不生效。
on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'develop' }}
    defaults:
      run:
        working-directory: apps/web
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        # vercel build 在 Vercel 平台上跑時，build container 本身就把
        # node_modules/.bin 放進 PATH；在本機／CI 用 CLI 跑 vercel build
        # 不會這樣做，偵測到的 build command（例如 vite build）會因為
        # 找不到 vite 執行檔而以 "vite: not found" 失敗，要自己把
        # node_modules/.bin 加進 PATH。
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt output
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            vercel deploy --prebuilt --token="$VERCEL_TOKEN"
          fi
