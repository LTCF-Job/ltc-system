name: Deploy API to Cloud Run

# push 觸發（而非依賴另一條 workflow 跑完的 workflow_run）：GitHub Actions 的
# workflow_run 一律讀 default branch 上的工作流程定義檔，不是觸發它的那個分支，
# 曾經導致修好的部署步驟被 default branch 的舊版蓋掉、每次都失敗。
# push 觸發則保證用的是「這次要部署的那個 commit」自己的工作流程定義。
# 只有 main 分支會觸發部署，其餘分支的測試與 build 交給 ci.yml 的 PR 檢查負責。
on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  ARTIFACT_REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY }}
  API_SERVICE: ${{ vars.API_SERVICE || 'ltc-api' }}
  MIGRATION_JOB: ${{ vars.MIGRATION_JOB || 'ltc-api-migrate' }}
  IMAGE_TAG: ${{ github.sha }}
  # 以下皆為 Cloud Run service／job 的非機密設定值，跟 GCP_PROJECT_ID 等一樣走
  # GitHub Environment variables；機密值一律用 Secret Manager 的 secret 名稱參照
  # （見 deploy-prod job 的 --set-secrets），密碼與金鑰本身不會進到這個 workflow。
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
  STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'ltc-exports' }}
  STORAGE_SIGNED_URL_TTL: ${{ vars.STORAGE_SIGNED_URL_TTL || '24h' }}
  NOTIFY_FROM: ${{ vars.NOTIFY_FROM || 'noreply@ltc.example.com' }}
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'info' }}
  DB_MAX_OPEN_CONNS: ${{ vars.DB_MAX_OPEN_CONNS || '5' }}
  DB_MAX_IDLE_CONNS: ${{ vars.DB_MAX_IDLE_CONNS || '2' }}

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build server and migration binaries
        run: |
          go build ./cmd/server
          go build ./cmd/migrate

  build-image:
    name: Build image once
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and publish API image
        run: |
          # --async 送出後改用 gcloud builds log --stream 撈進度：直接呼叫
          # `gcloud builds submit`（不加 --async）會用 gcloud 內建的即時串流，
          # 部署用的 service account 沒有專案 Viewer 權限時會直接失敗；
          # `|| true` 讓撈 log 失敗不影響結果判斷，真正的成功／失敗看下面的 STATUS。
          BUILD_ID=$(gcloud builds submit apps/api \
            --project "$GCP_PROJECT_ID" \
            --tag "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api:${IMAGE_TAG}" \
            --async \
            --format="value(id)")
          gcloud builds log "$BUILD_ID" --project "$GCP_PROJECT_ID" --stream || true
          STATUS=$(gcloud builds describe "$BUILD_ID" --project "$GCP_PROJECT_ID" --format="value(status)")
          echo "Build $BUILD_ID finished with status: $STATUS"
          [ "$STATUS" = "SUCCESS" ]

  deploy-prod:
    name: Migrate and deploy Production
    needs: build-image
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Sync migration job configuration
        # gcloud run jobs update 若只帶 --image，其餘 env／secret 一律沿用 Console 手動
        # 設定的舊值；改用 --set-env-vars／--set-secrets 讓這個 workflow 成為 job 設定的
        # 唯一真相來源，之後改設定只要改這個檔案，不用再去 Console 手動點。
        # ALLOWED_ORIGINS 內容可能含多個以逗號分隔的網址，用 "^;^" 把 gcloud 預設的
        # 逗號分隔符換成分號，逗號才不會被誤判成下一組 KEY=VALUE 的分界。
        run: |
          gcloud run jobs update "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api:${IMAGE_TAG}" \
            --set-env-vars="^;^APP_ENV=production;SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF};SUPABASE_JWKS_URL=https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json;ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
            --set-secrets="^;^DATABASE_URL=DATABASE_URL:latest;ENCRYPTION_KEY=ENCRYPTION_KEY:latest;HMAC_KEY=HMAC_KEY:latest;SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest;DEFAULT_ADMIN_EMAIL=DEFAULT_ADMIN_EMAIL:latest;DEFAULT_ADMIN_PASSWORD=DEFAULT_ADMIN_PASSWORD:latest"

      - name: Run database migrations
        run: |
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait

      - name: Deploy API service
        # 同上，service 跟 job 是各自獨立的資源，設定不互通，這裡也要完整宣告一次。
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/api:${IMAGE_TAG}" \
            --platform managed \
            --set-env-vars="^;^APP_ENV=production;STORAGE_BUCKET=${STORAGE_BUCKET};STORAGE_SIGNED_URL_TTL=${STORAGE_SIGNED_URL_TTL};NOTIFY_FROM=${NOTIFY_FROM};LOG_LEVEL=${LOG_LEVEL};SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF};SUPABASE_JWKS_URL=https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json;DB_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS};DB_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS};ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" \
            --set-secrets="^;^DATABASE_URL=DATABASE_URL:latest;ENCRYPTION_KEY=ENCRYPTION_KEY:latest;HMAC_KEY=HMAC_KEY:latest;SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest"
