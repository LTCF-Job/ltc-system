services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ltc-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (Supabase transaction pooler, port 6543)}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-5}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_LIFETIME: ${DB_MAX_CONN_LIFETIME:-1h}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-30m}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      HMAC_KEY: ${HMAC_KEY:?HMAC_KEY is required}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL is required}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:?SUPABASE_PROJECT_REF is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required (comma-separated frontend origins)}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-ltc-exports}
      STORAGE_SIGNED_URL_TTL: ${STORAGE_SIGNED_URL_TTL:-24h}
      GOOGLE_SA_JSON: ${GOOGLE_SA_JSON:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      NOTIFY_FROM: ${NOTIFY_FROM:-noreply@ltc.example.com}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ltc-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
